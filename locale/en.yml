stezkoy-audex:
  admin:
    heading: Audex
    help_block: >-
      Audex lets you manage advertising script blocks. Each block is a piece of
      HTML/JS (usually a script tag from your ad network) that Audex injects
      into the page on the server — and completely omits for excluded users and
      group members, so the code is never even loaded in their browser.
    scripts_section: Ad Script Blocks
    scripts_section_help: >-
      Paste the full snippet exactly as provided by your ad network, including
      its script tags. Blocks marked "head" are placed inside the page head;
      blocks marked "foot" are placed before the closing body tag.
    section_counter: "{enabled} of {total} enabled"
    empty: No script blocks yet. Click "Add block" to create one.
    add_button: Add Block
    save_button: Save
    cancel_button: Cancel
    delete_button: Delete
    edit_button: Edit
    move_up: Move up
    move_down: Move down

    modal_title_create: Add Script Block
    modal_title_edit: Edit Script Block
    name_label: Block Name
    name_placeholder: e.g. AdSense header
    name_help: A short internal label. Angle brackets and double dashes are not allowed.
    position_label: Placement
    position_help: "head — inside the page head. foot — before the closing body tag."
    position_head: Page head
    position_foot: End of body
    enabled_switch: Enabled
    enabled_switch_help: Toggle to turn this block on or off.
    code_label: Script Code
    code_help: >-
      Pasted into the page verbatim. If the code contains no script tag, it is
      treated as plain JavaScript and wrapped into one automatically. Inside
      JavaScript strings, escape the closing script tag with a backslash before
      the slash.

    exclusions_section: Exclusions
    exclusions_section_help: >-
      Users listed here and members of the selected groups will not receive any
      ad scripts at all. Guests always see ads.
    groups_label: Excluded Groups
    groups_help: Members of these groups will not receive ad scripts.
    groups_empty: No groups available.
    users_label: Excluded Users
    users_help: These specific users will not receive ad scripts regardless of their groups.
    users_add_button: Add Users
    users_empty: No users excluded.
    users_search_placeholder: Search users…
    users_selected: "Selected: {count}"

    confirm_delete: "Delete block \"{name}\"? This cannot be undone."
    saved: Settings saved.

    error_json: The setting value is not valid JSON.
    error_too_many: "Too many script blocks — the limit is {count}."
    error_block_json: "Block {block} is malformed."
    error_name: "Block {block}: the name must be a string of up to 100 characters."
    error_name_html: "Block {block}: the name must not contain angle brackets or double dashes."
    error_code_empty: "Block {block}: the script code must not be empty."
    error_code_too_long: "Block {block}: the code exceeds the limit of {max} bytes."
    error_position: "Block {block}: the placement must be \"head\" or \"foot\"."
    error_enabled: "Block {block}: \"enabled\" must be true or false."
    excluded_users:
      error_too_many: Too many excluded users — the limit is 1000.
      error_invalid: "Invalid entry in excluded users (position {index})."
    excluded_groups:
      error_too_many: Too many excluded groups — the limit is 1000.
      error_invalid: "Invalid entry in excluded groups (position {index})."
    request_error: Could not save the settings. Please check the input and try again.
